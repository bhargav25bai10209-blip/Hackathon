<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cattle & Buffalo Breed Identification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <div class="text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">AI Cattle & Buffalo Breed Identification</h1>
            <p class="mt-4 text-lg text-gray-500">Upload an image to identify the breed, or view the model's overall performance metrics below.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Predictor Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Test the Model</h2>
                <form id="uploadForm" class="space-y-4">
                    <div class="flex items-center justify-center w-full">
                        <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <img id="preview-image" src="" alt="Preview" class="hidden max-h-32 mb-4 rounded-lg shadow-sm border border-gray-200 object-contain">
                                <p id="file-label-text" class="mb-2 text-sm text-gray-500 font-semibold">Click to upload an image</p>
                                <p class="text-xs text-gray-500">PNG, JPG or JPEG</p>
                            </div>
                            <input id="dropzone-file" type="file" class="hidden" accept="image/*" />
                        </label>
                    </div>
                    <button type="submit" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-3 focus:outline-none transition-colors">
                        Predict Breed
                    </button>
                </form>

                <div id="resultContainer" class="mt-8 hidden">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Top Predictions</h3>
                    <ul id="predictionsList" class="space-y-3">
                        <!-- Filled by JS -->
                    </ul>
                </div>
            </div>

            <!-- Metrics Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Model Evaluation Metrics</h2>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-blue-50 rounded-lg p-4 text-center">
                        <p class="text-sm font-medium text-blue-600">Accuracy</p>
                        <p id="val-accuracy" class="text-2xl font-bold text-blue-900 mt-1">-</p>
                    </div>
                    <div class="bg-indigo-50 rounded-lg p-4 text-center">
                        <p class="text-sm font-medium text-indigo-600">Top-3 Accuracy</p>
                        <p id="val-top3" class="text-2xl font-bold text-indigo-900 mt-1">-</p>
                    </div>
                    <div class="bg-purple-50 rounded-lg p-4 text-center">
                        <p class="text-sm font-medium text-purple-600">Precision</p>
                        <p id="val-precision" class="text-2xl font-bold text-purple-900 mt-1">-</p>
                    </div>
                    <div class="bg-pink-50 rounded-lg p-4 text-center">
                        <p class="text-sm font-medium text-pink-600">F1 Score</p>
                        <p id="val-f1" class="text-2xl font-bold text-pink-900 mt-1">-</p>
                    </div>
                    <div class="bg-teal-50 rounded-lg p-4 text-center col-span-2">
                        <p class="text-sm font-medium text-teal-600">Recall</p>
                        <p id="val-recall" class="text-2xl font-bold text-teal-900 mt-1">-</p>
                    </div>
                </div>

                <h3 class="text-lg font-semibold text-gray-800 mb-4">Confusion Matrix</h3>
                <div class="border rounded-lg p-2 bg-gray-50 flex justify-center">
                    <img id="cm-image" src="" alt="Confusion Matrix" class="max-w-full h-auto max-h-64 rounded">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch metrics on load
        fetch('/metrics')
            .then(res => res.json())
            .then(data => {
                document.getElementById('val-accuracy').textContent = (data.accuracy * 100).toFixed(1) + '%';
                document.getElementById('val-top3').textContent = (data.top_3_accuracy * 100).toFixed(1) + '%';
                document.getElementById('val-precision').textContent = (data.precision * 100).toFixed(1) + '%';
                document.getElementById('val-recall').textContent = (data.recall * 100).toFixed(1) + '%';
                document.getElementById('val-f1').textContent = (data.f1_score * 100).toFixed(1) + '%';
                document.getElementById('cm-image').src = data.confusion_matrix_url;
            })
            .catch(err => console.error("Error fetching metrics:", err));

        // Display selected filename and image preview
        const fileInput = document.getElementById('dropzone-file');
        const fileLabel = document.getElementById('file-label-text');
        const previewImage = document.getElementById('preview-image');
        
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                fileLabel.textContent = "Selected: " + file.name;
                fileLabel.classList.remove('text-gray-500');
                fileLabel.classList.add('text-blue-600', 'font-bold');
                
                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewImage.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                fileLabel.textContent = "Click to upload an image";
                fileLabel.classList.remove('text-blue-600', 'font-bold');
                fileLabel.classList.add('text-gray-500');
                previewImage.src = "";
                previewImage.classList.add('hidden');
            }
        });

        // Handle form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('dropzone-file');
            if (fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const list = document.getElementById('predictionsList');
                list.innerHTML = ''; // clear
                
                data.top_3.forEach((pred, index) => {
                    const li = document.createElement('li');
                    li.className = "flex items-center justify-between p-3 rounded-lg " + (index === 0 ? "bg-green-50 border border-green-100" : "bg-gray-50");
                    li.innerHTML = `
                        <div>
                            <p class="font-medium ${index === 0 ? 'text-green-800' : 'text-gray-700'}">${pred.breed}</p>
                            <p class="text-xs ${index === 0 ? 'text-green-600' : 'text-gray-500'}">Region: ${pred.native_region}</p>
                        </div>
                        <span class="font-bold ${index === 0 ? 'text-green-700' : 'text-gray-600'}">${(pred.confidence * 100).toFixed(2)}%</span>
                    `;
                    list.appendChild(li);
                });
                
                document.getElementById('resultContainer').classList.remove('hidden');
            } catch (err) {
                alert("An error occurred during prediction.");
                console.error(err);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
